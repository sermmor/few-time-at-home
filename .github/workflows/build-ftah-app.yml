name: Build ftahApp (all platforms)

on:
  workflow_dispatch:   # triggered manually from the Actions tab

# ── Jobs ─────────────────────────────────────────────────────────────────────
# Four independent jobs that run in parallel on the free tier.
# Each uploads its artifact; download them from the Actions summary page.
jobs:

  # ── Windows ──────────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: ftahApp
        run: flutter pub get
      - name: Build Windows release
        working-directory: ftahApp
        run: flutter build windows --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftah-app-windows
          path: ftahApp/build/windows/x64/runner/Release/
          retention-days: 30

  # ── macOS ────────────────────────────────────────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: ftahApp
        run: flutter pub get
      - name: Build macOS release
        working-directory: ftahApp
        env:
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: "-"
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ""
        run: flutter build macos --release
      - name: Create ZIP archive
        run: |
          cd ftahApp/build/macos/Build/Products/Release
          zip -r --symlinks ftah_app.zip ftah_app.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftah-app-macos
          path: ftahApp/build/macos/Build/Products/Release/ftah_app.zip
          retention-days: 30

  # ── Linux ────────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      # Flutter Linux desktop needs these native build deps
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Install dependencies
        working-directory: ftahApp
        run: flutter pub get
      - name: Build Linux release
        working-directory: ftahApp
        run: flutter build linux --release
      - name: Create tar.gz archive
        run: |
          cd ftahApp/build/linux/x64/release/bundle
          tar czf ftah_app_linux.tar.gz *
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftah-app-linux
          path: ftahApp/build/linux/x64/release/bundle/ftah_app_linux.tar.gz
          retention-days: 30

  # ── Android ──────────────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: ftahApp
        run: flutter pub get
      - name: Build Android APK (debug — no signing key)
        working-directory: ftahApp
        run: flutter build apk --debug
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftah-app-android
          path: ftahApp/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
